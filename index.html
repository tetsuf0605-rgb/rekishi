<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="日本史">
<meta name="theme-color" content="#1f2545">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<link rel="manifest" href="manifest.webmanifest">
<title>日本史 問題集</title>
<style>
  :root{
    --paper:#f3ede0;        /* 和紙 */
    --paper2:#ebe2cf;
    --ink:#23283f;          /* 藍墨 */
    --ink2:#5a5f72;
    --shu:#c8412b;          /* 朱 */
    --shu-d:#a8341f;
    --gold:#9c7a3c;         /* 古色 */
    --green:#3f7d4f;
    --line:#d6cbb3;
    --card:#fbf7ee;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
    background:var(--paper);
    color:var(--ink);
    line-height:1.7;
    font-size:17px;
    -webkit-text-size-adjust:100%;
  }
  .wrap{max-width:640px;margin:0 auto;padding:18px 16px 60px;}
  .mincho{font-family:"Hiragino Mincho ProN","Yu Mincho",serif;}

  /* ヘッダー */
  header{text-align:center;padding:10px 0 6px;}
  header .eyebrow{font-size:12px;letter-spacing:.4em;color:var(--shu);margin:0;}
  header h1{font-family:"Hiragino Mincho ProN","Yu Mincho",serif;font-size:26px;margin:4px 0 2px;letter-spacing:.06em;}
  header .sub{font-size:12.5px;color:var(--ink2);margin:0;}

  /* カード */
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin:14px 0;
    box-shadow:0 1px 0 #fff inset,0 6px 18px rgba(40,30,10,.06);}

  /* ホーム：統計 */
  .stat-row{display:flex;gap:10px;margin:0 0 6px;}
  .stat{flex:1;text-align:center;background:var(--paper2);border-radius:10px;padding:10px 4px;}
  .stat b{display:block;font-size:22px;font-family:"Hiragino Mincho ProN",serif;color:var(--ink);}
  .stat span{font-size:11.5px;color:var(--ink2);}

  /* ラベル＆選択チップ */
  .label{font-size:13px;color:var(--ink2);margin:16px 0 7px;font-weight:600;letter-spacing:.02em;}
  .chips{display:flex;flex-wrap:wrap;gap:8px;}
  .chip{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:999px;
    padding:9px 15px;font-size:14px;cursor:pointer;transition:.12s;min-height:42px;}
  .chip.on{background:var(--ink);color:#fff;border-color:var(--ink);}
  .chip.sm{padding:8px 13px;font-size:13.5px;}
  .chip.unit{border-radius:12px;text-align:left;line-height:1.35;padding:9px 14px 9px 12px;}
  .chip.unit .ck{display:inline-block;width:18px;height:18px;line-height:16px;text-align:center;border:1.5px solid var(--line);
    border-radius:5px;margin-right:8px;font-size:12px;vertical-align:-3px;background:#fff;color:var(--ink);}
  .chip.unit.on .ck{border-color:#fff;}
  .chip.unit small{display:block;font-size:11px;opacity:.75;margin-left:26px;}

  /* 図 */
  .figbox{background:#fff;border:1px solid var(--line);border-radius:12px;padding:6px;margin:0 0 12px;}
  .figbox svg{width:100%;height:auto;display:block;max-height:56vh;}
  .figcap{font-size:12px;color:var(--ink2);text-align:center;margin-top:4px;}

  /* ボタン */
  .btn{display:block;width:100%;border:none;border-radius:12px;padding:16px;font-size:18px;font-weight:700;
    cursor:pointer;margin-top:18px;letter-spacing:.05em;}
  .btn.primary{background:var(--shu);color:#fff;box-shadow:0 4px 0 var(--shu-d);}
  .btn.primary:active{transform:translateY(2px);box-shadow:0 2px 0 var(--shu-d);}
  .btn.ghost{background:transparent;color:var(--ink2);border:1px solid var(--line);box-shadow:none;font-size:15px;padding:12px;font-weight:600;}
  .btn.resume{background:#fff;color:var(--shu-d);border:1.5px solid var(--shu);box-shadow:none;}
  .btn.sm{padding:11px;font-size:15px;margin-top:10px;}

  /* 進捗バー */
  .topbar{display:flex;align-items:center;justify-content:space-between;font-size:13px;color:var(--ink2);margin-bottom:4px;}
  .prog{height:7px;background:var(--paper2);border-radius:99px;overflow:hidden;margin-bottom:14px;}
  .prog > i{display:block;height:100%;background:var(--shu);width:0;transition:width .25s;}

  /* 問題 */
  .qcat{display:inline-block;font-size:11.5px;color:var(--gold);border:1px solid var(--line);border-radius:99px;padding:2px 10px;margin-bottom:10px;letter-spacing:.08em;}
  .qtype{color:var(--shu);font-weight:700;}
  .qtext{font-size:19px;font-weight:600;white-space:pre-line;margin:2px 0 16px;line-height:1.6;}

  /* 選択肢 */
  .opt{display:block;width:100%;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:11px;
    padding:14px 15px;margin:9px 0;font-size:16px;cursor:pointer;color:var(--ink);transition:.1s;min-height:50px;}
  .opt:active{background:var(--paper2);}
  .opt.correct{border-color:var(--green);background:#eaf3ec;}
  .opt.wrong{border-color:var(--shu);background:#f7e9e6;}
  .opt.dim{opacity:.55;}
  .opt .mk{float:right;font-weight:800;font-size:18px;}

  /* 並べ替え */
  .ord-pool,.ord-ans{display:flex;flex-direction:column;gap:8px;margin:6px 0;}
  .ord-ans{min-height:8px;border:1.5px dashed var(--line);border-radius:11px;padding:8px;background:#fff8;}
  .ord-item{background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;font-size:15.5px;cursor:pointer;}
  .ord-item .num{display:inline-block;width:22px;height:22px;line-height:22px;text-align:center;background:var(--ink);color:#fff;border-radius:99px;font-size:12px;margin-right:9px;}
  .ord-empty{color:var(--ink2);font-size:13px;text-align:center;padding:8px;}

  /* 記述 */
  .reveal{background:var(--paper2);border-radius:11px;padding:14px;margin-top:8px;}
  .ansinput{width:100%;font-size:18px;padding:14px 15px;border:1.5px solid var(--line);border-radius:11px;
    background:#fff;color:var(--ink);margin-bottom:10px;min-height:52px;}
  .ansinput:focus{outline:none;border-color:var(--shu);}
  .ansinput.correct{border-color:var(--green);background:#eaf3ec;}
  .ansinput.wrong{border-color:var(--shu);background:#f7e9e6;}
  .reveal h4{margin:0 0 6px;font-size:13px;color:var(--ink2);letter-spacing:.05em;}
  .reveal .model{font-size:16px;margin-bottom:12px;}
  .kw{display:flex;align-items:center;gap:10px;padding:8px 4px;border-top:1px dashed var(--line);}
  .kw input{width:22px;height:22px;accent-color:var(--green);}
  .kw label{font-size:15px;}
  .selfask{font-size:14px;color:var(--ink2);margin:12px 0 4px;text-align:center;}
  .selfrow{display:flex;gap:10px;}
  .selfrow .btn{margin-top:6px;}
  .btn.maru{background:var(--green);color:#fff;box-shadow:0 4px 0 #2f5f3c;}
  .btn.batsu{background:#fff;color:var(--shu);border:1.5px solid var(--shu);box-shadow:none;}

  /* フィードバック */
  .fb{border-radius:11px;padding:13px 15px;margin-top:14px;font-size:15px;}
  .fb.ok{background:#eaf3ec;color:var(--green);}
  .fb.ng{background:#f7e9e6;color:var(--shu-d);}
  .fb b{font-size:17px;}
  .exp{font-size:14.5px;color:var(--ink);margin-top:8px;line-height:1.65;}

  /* 結果 */
  .score-big{text-align:center;font-family:"Hiragino Mincho ProN",serif;}
  .score-big .n{font-size:54px;color:var(--shu);line-height:1.1;}
  .score-big .d{font-size:20px;color:var(--ink2);}
  .msg{text-align:center;font-size:16px;margin:6px 0 4px;}
  .wronglist{margin-top:14px;}
  .wronglist li{font-size:14px;color:var(--ink2);margin:6px 0;padding-left:4px;list-style:none;border-left:3px solid var(--line);padding:4px 0 4px 10px;}

  .hidden{display:none;}
  .footnote{text-align:center;font-size:11px;color:var(--ink2);margin-top:26px;}
</style>
</head>
<body>
<div class="wrap">

  <!-- ================= ホーム ================= -->
  <section id="home">
    <header>
      <p class="eyebrow">日本史</p>
      <h1 id="homeTitle">古代国家のあゆみ</h1>
      <p class="sub" id="homeSub">縄文 ・ 弥生 ・ 古墳とヤマト政権</p>
    </header>

    <div class="card">
      <div class="stat-row">
        <div class="stat"><b id="st-ans">0</b><span>といた数</span></div>
        <div class="stat"><b id="st-acc">—</b><span>正答率</span></div>
        <div class="stat"><b id="st-wrong">0</b><span>にがて</span></div>
      </div>

      <div class="label">テスト範囲（タップで追加・解除。いくつでも選べます）</div>
      <div class="chips" id="unitChips"></div>

      <div class="label">はんい</div>
      <div class="chips" id="catChips"></div>

      <div class="label">もんだい数</div>
      <div class="chips" id="countChips">
        <button class="chip sm on" data-count="10">10問</button>
        <button class="chip sm" data-count="20">20問</button>
        <button class="chip sm" data-count="0">ぜんぶ</button>
      </div>

      <div class="label">出題形式</div>
      <div class="chips" id="modeChips">
        <button class="chip sm on" data-mode="choice">選択モード</button>
        <button class="chip sm" data-mode="input">入力モード（漢字でもかなでもOK）</button>
      </div>

      <button class="btn resume hidden" id="resumeBtn">▶ 続きから再開</button>
      <button class="btn primary" id="startBtn">スタート</button>
      <button class="btn ghost sm" id="reviewBtn">にがてな問題だけ復習する</button>
    </div>

    <button class="btn ghost sm" id="resetBtn" style="max-width:240px;margin:0 auto;">記録をリセット</button>
    <p class="footnote mincho">出題は毎回ランダム。記録はこの端末に保存されます。</p>
  </section>

  <!-- ================= 出題 ================= -->
  <section id="quiz" class="hidden">
    <div class="topbar">
      <span id="qcount">1 / 10</span>
      <span id="qscore">正解 0</span>
    </div>
    <div class="prog"><i id="progBar"></i></div>

    <div class="card">
      <span class="qcat" id="qcat">縄文</span>
      <div class="qtext" id="qtext"></div>
      <div id="qbody"></div>
      <div id="qfeedback"></div>
    </div>

    <button class="btn primary hidden" id="nextBtn">次へ</button>
    <button class="btn ghost sm" id="quitBtn">やめてホームへ</button>
  </section>

  <!-- ================= 結果 ================= -->
  <section id="result" class="hidden">
    <div class="card">
      <div class="score-big"><span class="n" id="rsScore">0</span><span class="d" id="rsTotal"> / 0</span></div>
      <p class="msg mincho" id="rsMsg"></p>
      <ul class="wronglist" id="rsWrong"></ul>
      <button class="btn primary" id="againWrongBtn">まちがえた問題をもう一度</button>
      <button class="btn ghost" id="homeBtn">ホームへ戻る</button>
    </div>
  </section>

</div>

<script>
/* =======================================================================
   1) データ層 ── ノートを構造化したもの（ここを増やせば問題が増えます）
   ======================================================================= */

}

/* =======================================================================
   2) 生成層 ── 用語データから一問一答・穴埋めを自動生成（テンプレ×大量データ）
   ======================================================================= */
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function pickDistinct(pool,n,exclude){
  const out=[];const used=new Set(exclude||[]);
  for(const x of shuffle(pool)){if(out.length>=n)break;if(!used.has(x)){out.push(x);used.add(x);}}
  return out;
}
// 2つの説明文が似すぎていないか判定（文字2-gramの重なり率）。
// 似すぎる説明は「どちらも正解に読める」ダミーになってしまうので除外する。
function tooSimilar(a,b){
  const grams=s=>{const g=new Set();for(let i=0;i<s.length-1;i++)g.add(s.slice(i,i+2));return g;};
  const A=grams(a),B=grams(b);if(A.size===0||B.size===0)return false;
  let inter=0;A.forEach(x=>{if(B.has(x))inter++;});
  return inter/(A.size+B.size-inter) > 0.8;
}
// 種類を大まかな「系統」にまとめる。同じ種類が足りないときの補充先。
const FAMILY={
  土器:"もの",石器:"もの",金属器:"もの",遺物:"もの",
  遺跡:"場所",古墳墓:"場所",国地域:"場所",建物:"場所",
  称号:"称号役職",役職身分:"称号役職",
  制度:"ことば",土地人民:"ことば",史料:"ことば",時代自然:"ことば",文化思想:"ことば",
  人物:"人物",動物:"動物",
  // 範囲2で追加した種類
  都宮:"場所",寺院建築:"場所",城柵:"場所",建造物:"場所",役所:"称号役職",
  仏像:"美術",絵画工芸:"美術",技法:"ことば",仏の種類:"ことば",税:"ことば",
  出来事:"できごと",外交:"ことば",文化:"ことば",貨幣:"もの",ことば:"ことば"
};
// 種類の仲間が少ないときに使う、問題用のダミー選択肢
const EXTRA_DUMMY={貨幣:["開元通宝","寛永通宝","永楽通宝"]};
// terms: その範囲の用語（[用語,よみ,意味,分野,種類,別解の配列]）
// widen: true のとき、ダミーが足りなければ他の範囲の同系統の用語からも補う
function generateFromTerms(terms,widen){
  const toObj=t=>({term:t[0],read:t[1],mean:t[2],cat:t[3],kind:t[4]||t[3],alt:t[5]||[]});
  const objs=terms.map(toObj);
  const qs=[];
  // 出題語tに対し、key('mean'/'term')のダミー候補を「同種→同系統→(他の範囲の同系統)」の順で集める
  function candidates(t,key,correct){
    const sim=(key==="mean")?(x=>tooSimilar(x,correct)):(()=>false);
    const collect=arr=>arr.filter(o=>o.term!==t.term).map(o=>o[key]).filter(v=>v!==correct&&!sim(v));
    let pool=Array.from(new Set(collect(objs.filter(o=>o.kind===t.kind))));
    if(pool.length<3){
      const fam=collect(objs.filter(o=>FAMILY[o.kind]===FAMILY[t.kind]));
      pool=Array.from(new Set(pool.concat(fam)));
    }
    if(pool.length<3&&key==="term"&&EXTRA_DUMMY[t.kind]){
      pool=Array.from(new Set(pool.concat(EXTRA_DUMMY[t.kind].filter(v=>v!==correct))));
    }
    if(pool.length<3&&widen){
      const others=ALL_TERMS().map(toObj).filter(o=>FAMILY[o.kind]===FAMILY[t.kind]);
      pool=Array.from(new Set(pool.concat(collect(others))));
    }
    return pool;
  }
  objs.forEach(t=>{
    // 語句→意味（説明を選ぶ。入力には不向きなので選択のまま）
    qs.push({type:"mc",cat:t.cat,inputable:false,
      q:`「${t.term}」の説明として正しいものはどれ？`,
      choices:shuffle([t.mean,...pickDistinct(candidates(t,"mean",t.mean),3,[t.mean])]),
      a:t.mean,exp:`${t.term}（${t.read}）… ${t.mean}`});
    // 意味→語句（語句を答える。入力モードでは自由入力にできる）
    qs.push({type:"mc",cat:t.cat,inputable:true,term:t.term,read:t.read,answers:[t.term,t.read,...t.alt],
      q:`次の説明にあてはまる語句はどれ？\n「${t.mean}」`,
      choices:shuffle([t.term,...pickDistinct(candidates(t,"term",t.term),3,[t.term])]),
      a:t.term,exp:`答え：${t.term}（${t.read}）`});
  });
  return qs;
}

/* --- 図の問題を自動生成 ---
   label：図に実際に描いた番号（data-mk）だけを出題する（描いていない番号は出さない）
   pic  ：線画から 作品名・文化・寺院・つくり方 を問う */
function drawnMarkers(f){
  const svg=f.draw(0),nums=[],re=/data-mk="(\d+)"/g;let m;
  while((m=re.exec(svg)))nums.push(+m[1]);
  return nums;
}
function figQuestions(figs){
  const qs=[];
  const pics=Object.values(figs).filter(f=>f.kind==="pic");
  for(const id in figs){
    const f=figs[id];
    if(f.kind==="label"){
      const drawn=drawnMarkers(f);
      const parts=f.parts.filter(p=>drawn.includes(p.n));
      parts.forEach(p=>{
        const others=parts.filter(o=>o.t!==p.t).map(o=>o.t);
        qs.push({type:"mc",label:"図",cat:f.cat,fig:id,hl:p.n,inputable:true,
          term:p.t,read:p.r||"",answers:[p.t,p.r||"",...(p.alt||[])].filter(Boolean),
          q:`図の【${p.n}】にあてはまるものは？`,qInput:`図の【${p.n}】は何？`,
          listText:`${f.cap}の【${p.n}】`,
          choices:shuffle([p.t,...pickDistinct(others,3,[p.t])]),a:p.t,
          exp:`【${p.n}】${p.t}（${p.r}）… ${p.exp||""}`});
      });
    }else if(f.kind==="pic"){
      const same=pics.filter(o=>o!==f&&(o.group==="仏像")===(f.group==="仏像")).map(o=>o.name);
      const extra=f.group==="仏像"?ALL_TERMS().filter(t=>t[4]==="仏像").map(t=>t[0])
        :ALL_TERMS().filter(t=>t[4]==="絵画工芸").map(t=>t[0]).concat(["正倉院"]);
      const wrongNames=pickDistinct(same.length>=3?same:same.concat(extra),3,[f.name]);
      const base={label:"図",cat:f.cat,fig:id,hl:0,listText:`線画（${f.name}）`};
      const desc=`${f.name}（${f.read}）… ${f.feature}${f.culture}の${f.group==="仏像"?"仏像":"作品"}${f.temple?"。"+f.temple+"にある":""}${f.method?"。"+f.method:""}。`;
      qs.push({...base,type:"mc",inputable:true,term:f.name,read:f.read,answers:[f.name,f.read,...(f.alt||[])],
        q:"この線画の作品名は？",qInput:"この線画の作品名は？",
        choices:shuffle([f.name,...wrongNames]),a:f.name,exp:desc});
      qs.push({...base,type:"mc",inputable:false,q:"この線画の作品は、何文化のもの？",
        choices:["飛鳥文化","白鳳文化","天平文化"],a:f.culture,exp:desc});
      if(f.temple){
        const temples=["法隆寺","広隆寺","飛鳥寺","薬師寺","興福寺","東大寺","唐招提寺","四天王寺"];
        qs.push({...base,type:"mc",inputable:false,q:"この線画の作品がある寺院は？",
          choices:shuffle([f.temple,...pickDistinct(temples,3,[f.temple])]),a:f.temple,exp:desc});
      }
      if(f.method){
        qs.push({...base,type:"mc",inputable:false,q:"この線画の像は、どのようなつくり方？",
          choices:["金銅像","塑像","乾漆像"],a:f.method,exp:desc});
      }
    }
  }
  return qs;
}
function figSvg(id,hl){
  const f=UNIT_FIGS()[id];if(!f)return "";
  return `<div class="figbox"><svg viewBox="${f.vb}" preserveAspectRatio="xMidYMid meet" font-family="Hiragino Kaku Gothic ProN,Hiragino Sans,Yu Gothic,sans-serif">${f.draw(hl)}</svg>`+
    (f.kind==="label"?`<div class="figcap">${escapeHtml(f.cap)}</div>`:``)+`</div>`;
}

const UNITS = [

    cats:["旧石器","縄文","弥生","遣使","邪馬台国","古墳","政治","交流","文化"]},

    cats:["飛鳥の政治","飛鳥文化","大化の改新","律令国家への道","白鳳文化","律令と平城京","農民と税","開墾と荘園","東アジアとの交流","天平文化","平安京と桓武"]}
];
function ALL_TERMS(){return UNITS.reduce((a,u)=>a.concat(u.terms),[]);}
function UNIT_FIGS(){return UNITS.reduce((a,u)=>Object.assign(a,u.figs),{});}

const ALL = [];
UNITS.forEach((u,ui)=>{
  let qs;
  if(ui===0){
    // 最初の範囲は、これまでの記録（正答率・にがて）を引き継ぐため、以前と同じ順番・同じIDの付け方にする
    qs=generateFromTerms(u.terms,false).concat(u.pool);
    qs.forEach((q,i)=>{q.unit=u.id;q.id=q.cat+"|"+q.type+"|"+(q.q.replace(/\s/g,"").slice(0,24))+"|"+i;});
  }else{
    // 2つ目以降の範囲は、内容からIDを作る（問題を途中に足しても記録がずれない）
    qs=generateFromTerms(u.terms,true).concat(figQuestions(u.figs),u.pool);
    const seen={};
    qs.forEach(q=>{
      let id=u.id+"|"+q.type+"|"+(q.fig?q.fig+(q.hl||""):"")+"|"+q.q.replace(/\s/g,"").slice(0,40)+"|"+String(q.a).slice(0,16);
      if(seen[id]){seen[id]++;id+="#"+seen[id];}else seen[id]=1;
      q.unit=u.id;q.id=id;
    });
  }
  ALL.push(...qs);
});

const FIG_CAT="図の問題";
const TYPE_LABEL = {mc:"選択",tf:"○か×か",order:"ならべかえ",desc:"記述"};

// --- 保存（localStorage、使えない環境ではメモリにフォールバック）---
const mem={v:{}};
const store={
  load(){try{return JSON.parse(localStorage.getItem("rekishi_quiz"))||{stats:{},wrong:[]};}catch(e){return mem.v.stats?mem.v:{stats:{},wrong:[]};}},
  save(d){try{localStorage.setItem("rekishi_quiz",JSON.stringify(d));}catch(e){mem.v=d;}}
};
function getData(){const d=store.load();d.stats=d.stats||{};d.wrong=d.wrong||[];return d;}

// 選んでいるテスト範囲（端末に記憶。はじめは一番新しい範囲）
const UI_KEY="rekishi_ui";
function loadUnits(){
  try{const u=JSON.parse(localStorage.getItem(UI_KEY));
    const ok=(u&&u.units||[]).filter(id=>UNITS.some(x=>x.id===id));
    if(ok.length)return new Set(ok);}catch(e){}
  return new Set([UNITS[UNITS.length-1].id]);
}
function saveUnits(){try{localStorage.setItem(UI_KEY,JSON.stringify({units:[...state.units]}));}catch(e){}}

let state={cat:"全範囲",count:10,mode:"choice",list:[],idx:0,score:0,answered:false,wrongThisRound:[],units:loadUnits()};
function selUnits(){return UNITS.filter(u=>state.units.has(u.id));}
function inSel(q){return state.units.has(q.unit);}
function catList(){
  const sel=selUnits();const list=["全範囲"];
  if(sel.some(u=>Object.keys(u.figs).length))list.push(FIG_CAT);
  sel.forEach(u=>list.push(...u.cats));
  return list;
}

// --- テスト範囲のタブ ---
function renderUnits(){
  const box=document.getElementById("unitChips");box.innerHTML="";
  UNITS.forEach(u=>{
    const on=state.units.has(u.id);
    const b=document.createElement("button");
    b.className="chip unit"+(on?" on":"");
    b.innerHTML=`<span class="ck">${on?"✓":""}</span>${escapeHtml(u.title)}<small>${escapeHtml(u.sub)}</small>`;
    b.onclick=()=>{
      if(on&&state.units.size===1)return; // 最低1つは選ぶ
      if(on)state.units.delete(u.id);else state.units.add(u.id);
      saveUnits();
      if(!catList().includes(state.cat))state.cat="全範囲";
      renderHome();
    };
    box.appendChild(b);
  });
}
function renderHeader(){
  const sel=selUnits();
  document.getElementById("homeTitle").textContent=sel.length===1?sel[0].title:"日本史 問題集";
  document.getElementById("homeSub").textContent=sel.length===1?sel[0].sub:sel.map(u=>u.title).join(" ＋ ");
}
function renderHome(){if(!catList().includes(state.cat))state.cat="全範囲";renderUnits();renderHeader();renderCats();renderStats();}

// --- ホーム描画 ---
function renderCats(){
  const box=document.getElementById("catChips");box.innerHTML="";
  catList().forEach(c=>{
    const b=document.createElement("button");
    b.className="chip"+(c===state.cat?" on":"");b.textContent=c;
    b.onclick=()=>{state.cat=c;renderCats();};
    box.appendChild(b);
  });
}
function renderStats(){
  // 選んでいるテスト範囲の分だけ集計する
  const d=getData();let seen=0,correct=0;
  const ids=new Set(ALL.filter(inSel).map(q=>q.id));
  Object.keys(d.stats).forEach(id=>{if(!ids.has(id))return;const s=d.stats[id];seen+=s.seen;correct+=s.correct;});
  document.getElementById("st-ans").textContent=seen;
  document.getElementById("st-acc").textContent=seen?Math.round(correct/seen*100)+"%":"—";
  document.getElementById("st-wrong").textContent=d.wrong.filter(id=>ids.has(id)).length;
  // 続きから再開ボタンの表示
  const btn=document.getElementById("resumeBtn");
  if(hasResume()){
    const r=getData().resume;
    btn.textContent=`▶ 続きから再開（${r.idx+1}/${r.ids.length}問目）`;
    btn.classList.remove("hidden");
  }else{
    btn.classList.add("hidden");
  }
}

// --- 中断・再開 ---
function findQById(id){return ALL.find(q=>q.id===id);}
function hasResume(){const r=getData().resume;return !!(r&&r.ids&&r.idx<r.ids.length);}
function saveResume(){
  const d=getData();
  d.resume={ids:state.list.map(q=>q.id),idx:state.idx,score:state.score,
    wrong:state.wrongThisRound.map(q=>q.id),mode:state.mode,cat:state.cat};
  store.save(d);
}
function clearResume(){const d=getData();delete d.resume;store.save(d);}
function resumeQuiz(){
  const r=getData().resume;if(!r)return;
  state.list=r.ids.map(findQById).filter(Boolean);
  if(state.list.length===0){clearResume();renderStats();return;}
  state.idx=Math.min(r.idx,state.list.length-1);
  state.score=r.score||0;
  state.wrongThisRound=(r.wrong||[]).map(findQById).filter(Boolean);
  state.mode=r.mode||"choice";
  state.cat=r.cat||state.cat;
  show("quiz");renderQuestion();
}

document.getElementById("countChips").addEventListener("click",e=>{
  if(!e.target.dataset.count)return;
  state.count=+e.target.dataset.count;
  [...document.querySelectorAll("#countChips .chip")].forEach(c=>c.classList.toggle("on",c===e.target));
});

document.getElementById("modeChips").addEventListener("click",e=>{
  if(!e.target.dataset.mode)return;
  state.mode=e.target.dataset.mode;
  [...document.querySelectorAll("#modeChips .chip")].forEach(c=>c.classList.toggle("on",c===e.target));
});

// --- 出題セット作成 ---
function buildList(reviewOnly){
  let pool=ALL.filter(inSel);
  if(reviewOnly){const w=new Set(getData().wrong);pool=pool.filter(q=>w.has(q.id));}
  else if(state.cat===FIG_CAT){pool=pool.filter(q=>q.fig);}
  else if(state.cat!=="全範囲"){pool=pool.filter(q=>q.cat===state.cat);}
  pool=shuffle(pool);
  if(state.count>0)pool=pool.slice(0,state.count);
  return pool;
}
function startQuiz(reviewOnly){
  const list=buildList(reviewOnly);
  if(list.length===0){alert(reviewOnly?"にがてな問題はまだありません。まずは通常モードで挑戦しよう！":"この範囲の問題がありません。");return;}
  clearResume();
  state.list=list;state.idx=0;state.score=0;state.wrongThisRound=[];
  show("quiz");renderQuestion();
}

function show(id){["home","quiz","result"].forEach(s=>document.getElementById(s).classList.toggle("hidden",s!==id));window.scrollTo(0,0);}

// --- 問題描画 ---
function renderQuestion(){
  const q=state.list[state.idx];state.answered=false;
  document.getElementById("qcount").textContent=`${state.idx+1} / ${state.list.length}`;
  document.getElementById("qscore").textContent=`正解 ${state.score}`;
  document.getElementById("progBar").style.width=(state.idx/state.list.length*100)+"%";
  document.getElementById("qcat").textContent=q.cat;
  const inputMode = (state.mode==="input" && q.type==="mc" && q.inputable);
  const qtextStr = inputMode ? (q.qInput||q.q.replace("あてはまる語句はどれ？","あてはまる語句は？")) : q.q;
  const tlabel = (q.label?q.label+"・":"")+(inputMode?"入力":TYPE_LABEL[q.type]);
  document.getElementById("qtext").innerHTML=`<span class="qtype">［${tlabel}］</span> `+escapeHtml(qtextStr);
  document.getElementById("qfeedback").innerHTML="";
  document.getElementById("nextBtn").classList.add("hidden");
  const body=document.getElementById("qbody");body.innerHTML="";
  if(q.fig){const fw=document.createElement("div");fw.innerHTML=figSvg(q.fig,q.hl);body.appendChild(fw.firstChild);}

  if(inputMode)            renderInput(q,body);
  else if(q.type==="mc")   renderMC(q,body);
  else if(q.type==="tf")   renderTF(q,body);
  else if(q.type==="order")renderOrder(q,body);
  else if(q.type==="desc") renderDesc(q,body);
}

// 入力のゆらぎを吸収：全角英数→半角、カタカナ→ひらがな、空白除去
function normalize(s){
  s=(s||"").trim();
  s=s.replace(/[Ａ-Ｚａ-ｚ０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0));
  s=s.replace(/[\u30a1-\u30f6]/g,c=>String.fromCharCode(c.charCodeAt(0)-0x60));
  s=s.replace(/[\s\u3000]/g,"");
  return s.toLowerCase();
}
function renderInput(q,body){
  const answers=(q.answers||[q.a]).map(normalize);
  const wrap=document.createElement("div");
  const inp=document.createElement("input");
  inp.type="text";inp.className="ansinput";
  inp.setAttribute("autocomplete","off");inp.setAttribute("autocapitalize","off");
  inp.setAttribute("autocorrect","off");inp.placeholder="答えを入力（漢字でもかなでもOK）";
  wrap.appendChild(inp);
  const row=document.createElement("div");row.className="selfrow";
  const dunno=document.createElement("button");dunno.className="btn batsu sm";dunno.textContent="わからない";
  const check=document.createElement("button");check.className="btn primary sm";check.textContent="答え合わせ";
  row.appendChild(dunno);row.appendChild(check);wrap.appendChild(row);
  body.appendChild(wrap);
  setTimeout(()=>inp.focus(),50);

  function grade(typed){
    if(state.answered)return;state.answered=true;
    const ok = typed!==null && answers.includes(normalize(typed));
    inp.disabled=true;inp.classList.add(ok?"correct":"wrong");
    const fb=document.getElementById("qfeedback");
    fb.innerHTML=`<div class="fb ${ok?"ok":"ng"}"><b>${ok?"○ 正解！":"× おしい"}</b>`+
      `<div class="exp">正解：${escapeHtml(q.term)}${q.read?"（"+escapeHtml(q.read)+"）":""}</div>`+(q.fig&&q.exp?`<div class="exp">${escapeHtml(q.exp)}</div>`:``)+
      (ok?``:`<div class="exp" style="color:var(--ink2)">「漢字」でも「ひらがな（読み）」でも正解になります。</div>`)+`</div>`;
    finishQuestion(q,ok,true,true);
  }
  check.onclick=()=>grade(inp.value);
  dunno.onclick=()=>grade(null);
  inp.addEventListener("keydown",ev=>{if(ev.key==="Enter")grade(inp.value);});
}

function renderMC(q,body){
  q.choices.forEach(c=>{
    const b=document.createElement("button");b.className="opt";b.textContent=c;
    b.onclick=()=>{if(state.answered)return;gradeChoice(q,c,b,q.a);};
    body.appendChild(b);
  });
}
function renderTF(q,body){
  [["○ 正しい",true],["× 誤り",false]].forEach(([t,val])=>{
    const b=document.createElement("button");b.className="opt";b.textContent=t;
    b.onclick=()=>{if(state.answered)return;gradeChoice(q,val,b,q.a);};
    body.appendChild(b);
  });
}
function gradeChoice(q,chosen,btn,answer){
  state.answered=true;
  const ok=chosen===answer;
  [...btn.parentNode.children].forEach(el=>{
    el.classList.add("dim");
    const isAns=(q.type==="tf")?((el.textContent[0]==="○")===answer):(el.textContent===answer);
    if(isAns){el.classList.remove("dim");el.classList.add("correct");el.innerHTML+='<span class="mk">○</span>';}
  });
  if(!ok){btn.classList.remove("dim");btn.classList.add("wrong");btn.innerHTML+='<span class="mk">×</span>';}
  finishQuestion(q,ok);
}

function renderOrder(q,body){
  const correct=q.items;const shuffled=shuffle(q.items);let answer=[];
  const ansBox=document.createElement("div");ansBox.className="ord-ans";
  const poolBox=document.createElement("div");poolBox.className="ord-pool";
  const hint=document.createElement("div");hint.className="ord-empty";hint.textContent="↑ ここに古い順で並びます";
  ansBox.appendChild(hint);

  function redraw(){
    ansBox.innerHTML="";
    if(answer.length===0)ansBox.appendChild(hint);
    answer.forEach((t,i)=>{
      const el=document.createElement("div");el.className="ord-item";
      el.innerHTML=`<span class="num">${i+1}</span>${escapeHtml(t)}`;
      el.onclick=()=>{if(state.answered)return;answer.splice(i,1);redraw();};
      ansBox.appendChild(el);
    });
    [...poolBox.children].forEach(el=>{el.style.display=answer.includes(el.dataset.t)?"none":"block";});
  }
  shuffled.forEach(t=>{
    const el=document.createElement("div");el.className="ord-item";el.dataset.t=t;el.textContent=t;
    el.onclick=()=>{if(state.answered)return;answer.push(t);redraw();};
    poolBox.appendChild(el);
  });
  const check=document.createElement("button");check.className="btn primary sm";check.textContent="答え合わせ";
  check.onclick=()=>{
    if(state.answered)return;
    if(answer.length!==correct.length){alert("ぜんぶ並べてね。");return;}
    state.answered=true;
    const ok=answer.every((t,i)=>t===correct[i]);
    [...ansBox.children].forEach((el,i)=>{
      if(el.classList.contains("ord-empty"))return;
      el.classList.add(answer[i]===correct[i]?"correct":"wrong");
    });
    if(!ok){
      const ans=document.createElement("div");ans.style.cssText="margin-top:10px;font-size:14px;color:var(--ink2)";
      ans.innerHTML="正しい順：<b>"+correct.map(escapeHtml).join(" → ")+"</b>";
      body.appendChild(ans);
    }
    finishQuestion(q,ok);
  };
  body.appendChild(ansBox);
  const lbl=document.createElement("div");lbl.className="ord-empty";lbl.textContent="下のカードをタップして並べよう";
  body.appendChild(lbl);
  body.appendChild(poolBox);body.appendChild(check);
  redraw();
}

function renderDesc(q,body){
  const note=document.createElement("div");note.className="ord-empty";
  note.textContent="頭の中（または紙）で答えてから、下のボタンを押そう。";
  body.appendChild(note);
  const reveal=document.createElement("button");reveal.className="btn primary sm";reveal.textContent="答えを確認する";
  reveal.onclick=()=>{
    reveal.remove();
    const box=document.createElement("div");box.className="reveal";
    box.innerHTML=`<h4>解答例</h4><div class="model">${escapeHtml(q.model)}</div><h4>入っているとよいキーワード</h4>`;
    q.keywords.forEach((k,i)=>{
      const row=document.createElement("div");row.className="kw";
      row.innerHTML=`<input type="checkbox" id="kw${i}"><label for="kw${i}">${escapeHtml(k)}</label>`;
      box.appendChild(row);
    });
    const ask=document.createElement("p");ask.className="selfask";ask.textContent="自分の答えは、ねらいに合っていた？";
    box.appendChild(ask);
    const row=document.createElement("div");row.className="selfrow";
    const yes=document.createElement("button");yes.className="btn maru sm";yes.textContent="○ できた";
    const no=document.createElement("button");no.className="btn batsu sm";no.textContent="× もう一度";
    yes.onclick=()=>{if(state.answered)return;state.answered=true;finishQuestion(q,true,true);};
    no.onclick=()=>{if(state.answered)return;state.answered=true;finishQuestion(q,false,true);};
    row.appendChild(yes);row.appendChild(no);box.appendChild(row);
    body.appendChild(box);
  };
  body.appendChild(reveal);
}

// --- 採点後の共通処理 ---
function finishQuestion(q,ok,quiet,skipFb){
  if(ok)state.score++;
  else state.wrongThisRound.push(q);
  // 保存
  const d=getData();
  const s=d.stats[q.id]||{seen:0,correct:0};s.seen++;if(ok)s.correct++;d.stats[q.id]=s;
  const ws=new Set(d.wrong);if(ok)ws.delete(q.id);else ws.add(q.id);d.wrong=[...ws];
  store.save(d);

  const fb=document.getElementById("qfeedback");
  if(!skipFb){
    if(!quiet){
      fb.innerHTML=`<div class="fb ${ok?"ok":"ng"}"><b>${ok?"○ 正解！":"× おしい"}</b>`+
        (q.exp?`<div class="exp">${escapeHtml(q.exp)}</div>`:``)+`</div>`;
    }else if(q.exp){
      fb.innerHTML=`<div class="fb ${ok?"ok":"ng"}"><div class="exp">${escapeHtml(q.exp)}</div></div>`;
    }
  }
  document.getElementById("qscore").textContent=`正解 ${state.score}`;
  document.getElementById("nextBtn").classList.remove("hidden");
}

document.getElementById("nextBtn").onclick=()=>{
  state.idx++;
  if(state.idx>=state.list.length)showResult();
  else renderQuestion();
};

function showResult(){
  document.getElementById("progBar").style.width="100%";
  const total=state.list.length;
  document.getElementById("rsScore").textContent=state.score;
  document.getElementById("rsTotal").textContent=` / ${total}`;
  const pct=Math.round(state.score/total*100);
  let msg = pct===100?"全問正解！みごとです。":pct>=80?"よくできました！":pct>=50?"その調子。あと少し。":"くり返せば必ず力になります。";
  document.getElementById("rsMsg").textContent=msg;
  const ul=document.getElementById("rsWrong");ul.innerHTML="";
  if(state.wrongThisRound.length){
    const h=document.createElement("div");h.className="label";h.textContent="まちがえた問題";ul.appendChild(h);
    state.wrongThisRound.forEach(q=>{const li=document.createElement("li");li.textContent=(q.listText?q.listText+"：":"")+q.q.replace(/\n/g," ");ul.appendChild(li);});
  }
  document.getElementById("againWrongBtn").style.display=state.wrongThisRound.length?"block":"none";
  clearResume();
  show("result");renderStats();
}

document.getElementById("startBtn").onclick=()=>startQuiz(false);
document.getElementById("reviewBtn").onclick=()=>startQuiz(true);
document.getElementById("resumeBtn").onclick=()=>resumeQuiz();
document.getElementById("quitBtn").onclick=()=>{
  const remaining = state.idx < state.list.length;
  const msg = remaining
    ? "ホームに戻りますか？\n途中までの内容は保存され、ホームの「続きから再開」であとで続けられます。"
    : "ホームに戻りますか？";
  if(!confirm(msg))return;
  if(remaining)saveResume(); else clearResume();
  show("home");renderHome();
};
document.getElementById("homeBtn").onclick=()=>{show("home");renderHome();};
document.getElementById("againWrongBtn").onclick=()=>{
  clearResume();
  state.list=shuffle(state.wrongThisRound);state.idx=0;state.score=0;state.wrongThisRound=[];
  show("quiz");renderQuestion();
};
document.getElementById("resetBtn").onclick=()=>{
  if(confirm("これまでの記録（といた数・正答率・にがて）をすべて消します。よろしいですか？")){
    store.save({stats:{},wrong:[]});renderStats();
  }
};

function escapeHtml(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

// 初期化
renderHome();
</script>
